<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <title>ChatLLM Lab</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github-dark.min.css"
    />

    <style>
      :root {
        --bg-page: #ffffff;
        --text: #0d0d0d;
        --muted: #777;
        --accent: #1a1a1a;
        --accent-hover: #404040;
        --user-bubble: #f4f4f4;
        --border: #e5e5e5;
        --sidebar-bg: #f7f7f8;
        --sidebar-width: 260px;
      }

      * { box-sizing: border-box; }

      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: var(--bg-page);
        color: var(--text);
        font-family:
          ui-sans-serif, -apple-system, system-ui,
          "Segoe UI", Helvetica, Arial, sans-serif;
      }

      button, input, textarea {
        font: inherit;
      }

      button { cursor: pointer; }

      .app-layout {
        width: 100%;
        height: 100%;
        display: flex;
      }

      .sidebar {
        width: var(--sidebar-width);
        height: 100%;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        overflow: hidden;
        background: var(--sidebar-bg);
        border-right: 1px solid var(--border);
      }

      .sidebar-header {
        padding: 12px;
        border-bottom: 1px solid var(--border);
      }

      .new-chat-btn {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: white;
      }

      .sidebar-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
      }

      .sidebar-item {
        padding: 10px 12px;
        margin-bottom: 2px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }

      .sidebar-item:hover,
      .sidebar-item.active {
        background: #e9e9ea;
      }

      .sidebar-item-title {
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 0.88rem;
      }

      .sidebar-item-del {
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 1.1rem;
      }

      .app-shell {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .app-header {
        padding: 12px 20px;
        min-height: 58px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        font-weight: 700;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .user-email {
        font-size: 0.82rem;
        color: var(--muted);
      }

      .secondary-btn,
      .primary-btn,
      .danger-light-btn,
      .icon-btn {
        border-radius: 8px;
        padding: 7px 12px;
      }

      .secondary-btn {
        background: white;
        border: 1px solid var(--border);
      }

      .secondary-btn:hover {
        background: #f5f5f5;
      }

      .primary-btn {
        background: var(--accent);
        color: white;
        border: 1px solid var(--accent);
        font-weight: 600;
      }

      .primary-btn:hover {
        background: var(--accent-hover);
      }

      .danger-light-btn {
        background: #fff5f5;
        color: #a52727;
        border: 1px solid #f0caca;
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .messages {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 28px 16px 16px;
      }

      .messages-inner {
        max-width: 760px;
        margin: 0 auto;
      }

      .bubble {
        line-height: 1.65;
        overflow-wrap: anywhere;
        padding: 16px 0;
      }

      .bubble.user {
        margin-left: auto;
        width: fit-content;
        max-width: 78%;
        padding: 12px 18px;
        border-radius: 18px;
        background: var(--user-bubble);
      }

      .bubble.assistant {
        width: 100%;
      }

      .bubble pre {
        overflow-x: auto;
        padding: 14px;
        border-radius: 10px;
        background: #1f2937;
        color: white;
      }

      .bubble :not(pre) > code {
        padding: 2px 5px;
        border-radius: 4px;
        background: #f4f4f4;
      }

      .composer-wrap {
        padding: 8px 16px 20px;
      }

      .composer {
        max-width: 760px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px 8px 18px;
        border: 1px solid #d9d9d9;
        border-radius: 28px;
        background: white;
        box-shadow: 0 2px 8px rgba(0,0,0,.06);
      }

      .composer input {
        flex: 1;
        border: 0;
        outline: 0;
        padding: 7px 0;
        font-size: 1rem;
      }

      .composer button {
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 50%;
        background: var(--accent);
        color: white;
      }

      .note {
        max-width: 760px;
        margin: 0 auto 8px;
        font-size: 0.86rem;
      }

      .error, .error-text {
        color: #b42318;
      }

      .success-text {
        color: #18794e;
      }

      .auth-shell {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .auth-card {
        width: 100%;
        max-width: 400px;
        padding: 36px 30px;
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 6px 30px rgba(0,0,0,.06);
      }

      .auth-brand,
      .auth-title {
        text-align: center;
      }

      .auth-title {
        color: var(--muted);
        font-size: 1rem;
        font-weight: 400;
      }

      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .auth-form input {
        padding: 12px 14px;
        border: 1px solid #d9d9d9;
        border-radius: 10px;
      }

      .auth-form button {
        padding: 12px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: white;
        font-weight: 600;
      }

      .auth-error {
        color: #b42318;
        font-size: .86rem;
      }

      .auth-toggle {
        text-align: center;
        color: var(--muted);
        font-size: .88rem;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(0,0,0,.42);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .modal-card {
        width: min(760px, 100%);
        max-height: min(720px, 90vh);
        overflow: auto;
        background: white;
        border-radius: 16px;
        box-shadow: 0 20px 80px rgba(0,0,0,.24);
        padding: 22px;
      }

      .modal-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      .modal-header h2 {
        margin: 0 0 4px;
        font-size: 1.15rem;
      }

      .modal-header p {
        margin: 0;
        color: var(--muted);
        font-size: .9rem;
      }

      .icon-btn {
        padding: 2px 8px;
        border: 0;
        background: transparent;
        font-size: 1.6rem;
      }

      .instructions-status {
        margin-top: 18px;
        color: var(--muted);
        font-size: .84rem;
      }

      .instructions-textarea {
        width: 100%;
        min-height: 300px;
        margin-top: 10px;
        padding: 14px;
        resize: vertical;
        border: 1px solid #d9d9d9;
        border-radius: 10px;
        line-height: 1.5;
        outline: 0;
      }

      .instructions-textarea:focus {
        border-color: #999;
      }

      .modal-meta {
        min-height: 24px;
        margin-top: 6px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        color: var(--muted);
        font-size: .82rem;
      }

      .modal-actions {
        margin-top: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .modal-actions-right {
        display: flex;
        gap: 8px;
      }

      .modal-loading {
        padding: 50px 0;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 720px) {
        .sidebar { display: none; }
        .user-email { display: none; }
        .bubble.user { max-width: 90%; }
        .modal-actions {
          align-items: stretch;
          flex-direction: column;
        }
        .modal-actions-right {
          justify-content: flex-end;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.22.20/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

    <script type="text/babel" src="/frontend/src/api.js"></script>
    <script type="text/babel" src="/frontend/src/Auth.jsx"></script>
    <script type="text/babel" src="/frontend/src/MessageContent.jsx"></script>
    <script type="text/babel" src="/frontend/src/Composer.jsx"></script>
    <script type="text/babel" src="/frontend/src/Sidebar.jsx"></script>
    <script type="text/babel" src="/frontend/src/App.jsx"></script>
  </body>
</html>
